name: Deploy with Migrations

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (leave empty for all)"
        required: false
        type: string
      skip_migrations:
        description: "Skip database migrations"
        required: false
        type: boolean
        default: false

# Permissions needed for deployment
permissions:
  contents: read
  actions: read

jobs:
  detect_deployed_apps:
    name: Detect Apps to Deploy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_deployments: ${{ steps.set-matrix.outputs.has_deployments }}
      has_api_changes: ${{ steps.set-matrix.outputs.has_api_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install turbo
        run: npm install -g turbo

      - name: Determine apps to deploy
        id: set-matrix
        run: |
          # Define all apps with service-level webhooks
          # Note: These are SERVICE webhooks in Portainer, not stack webhooks
          ALL_APPS='[
            {"app": "cyclist-profile", "webhook_secret": "PORTAINER_WEBHOOK_CYCLIST_PROFILE", "service": "atlas-cyclist-profile"},
            {"app": "cyclist-counts", "webhook_secret": "PORTAINER_WEBHOOK_CYCLIST_COUNTS", "service": "atlas-cyclist-counts"},
            {"app": "docs", "webhook_secret": "PORTAINER_WEBHOOK_DOCS", "service": "atlas-docs"}
          ]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual deployment
            if [[ "${{ github.event.inputs.app }}" != "" ]]; then
              # Deploy specific app
              DEPLOY_MATRIX=$(echo $ALL_APPS | jq -c --arg app "${{ github.event.inputs.app }}" '[.[] | select(.app == $app)]')
            else
              # Deploy all apps
              DEPLOY_MATRIX=$ALL_APPS
            fi
          else
            # Automatic deployment after Docker build
            # Detect which apps were actually built

            # Get list of all apps with Dockerfiles
            APPS_WITH_DOCKER=$(find apps -name "Dockerfile" -type f | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

            # Get list of affected apps (same logic as docker.yml)
            BASE_REF="HEAD^1"
            AFFECTED_APPS=$(npx turbo run build --dry-run=json --filter=...[HEAD^1] 2>/dev/null | jq -c '.tasks | map(.taskId | split(":")[0] | select(startswith("@atlas/"))) | map(sub("@atlas/"; "")) | unique' || echo '[]')

            # Filter to only include apps with Dockerfiles that were affected
            AFFECTED_DOCKER_APPS=$(echo $APPS_WITH_DOCKER | jq --argjson affected "$AFFECTED_APPS" -c '[.[] | select($affected | index(.))]')

            # Map to deployment matrix format
            # AFFECTED_DOCKER_APPS is an array of strings like ["cyclist-profile", "docs"]
            # We need to filter ALL_APPS to only include items where .app is in AFFECTED_DOCKER_APPS
            DEPLOY_MATRIX=$(echo "$ALL_APPS" | jq -c --argjson affected "$AFFECTED_DOCKER_APPS" '[.[] | select(.app as $app | $affected | index($app))]')
          fi

          echo "matrix=${DEPLOY_MATRIX}" >> $GITHUB_OUTPUT

          # Check if we have any deployments
          if [ "$(echo $DEPLOY_MATRIX | jq 'length')" -gt 0 ]; then
            echo "has_deployments=true" >> $GITHUB_OUTPUT
            echo "✅ Will deploy: $(echo $DEPLOY_MATRIX | jq -r '[.[].app] | join(", ")')"
          else
            echo "has_deployments=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No apps to deploy"
          fi

          # Check if any API apps changed (need migrations)
          API_APPS='["cyclist-counts", "cyclist-profile"]'
          DEPLOYED_APPS=$(echo "$DEPLOY_MATRIX" | jq -r '[.[].app]')
          HAS_API_CHANGES=$(echo "$DEPLOYED_APPS" | jq --argjson api "$API_APPS" '[.[] | select($api | index(.))] | length > 0')
          echo "has_api_changes=${HAS_API_CHANGES}" >> $GITHUB_OUTPUT
          echo "API apps to deploy: ${HAS_API_CHANGES}"

  # ============================================================================
  # Run Database Migrations (before deployment)
  # ============================================================================
  run_migrations:
    name: Run Database Migrations
    needs: detect_deployed_apps
    if: |
      needs.detect_deployed_apps.outputs.has_api_changes == 'true' &&
      github.event.inputs.skip_migrations != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @atlas/database build

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "🔄 Running database migrations..."
          node packages/database/dist/migrate.js

          if [ $? -eq 0 ]; then
            echo "✅ Migrations completed successfully"
          else
            echo "❌ Migrations failed"
            exit 1
          fi

      - name: Verify database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔍 Verifying database connection..."
          pnpm add -g pg
          node -e "
            const { Pool } = require('pg');
            const pool = new Pool({
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false }
            });
            pool.query('SELECT NOW() as current_time, version() as pg_version', (err, res) => {
              if (err) {
                console.error('❌ Database connection failed:', err);
                process.exit(1);
              }
              console.log('✅ Database connection successful');
              console.log('   Current time:', res.rows[0].current_time);
              console.log('   PostgreSQL version:', res.rows[0].pg_version);
              pool.end();
            });
          "

  deploy:
    name: Deploy ${{ matrix.app }} via Portainer Webhook
    needs: [detect_deployed_apps, run_migrations]
    if: |
      always() &&
      needs.detect_deployed_apps.outputs.has_deployments == 'true' &&
      (needs.run_migrations.result == 'success' || needs.run_migrations.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect_deployed_apps.outputs.matrix) }}
    steps:
      - name: Trigger Portainer Service Webhook
        run: |
          WEBHOOK_URL="${{ secrets[matrix.webhook_secret] }}"

          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️  Warning: Webhook URL not configured for ${{ matrix.app }}"
            echo "Please set ${{ matrix.webhook_secret }} in GitHub secrets"
            echo ""
            echo "To get the webhook URL:"
            echo "1. In Portainer: Containers → ${{ matrix.service }}"
            echo "2. Click 'Duplicate/Edit' or container details"
            echo "3. Enable webhook for the service"
            echo "4. Copy webhook URL"
            echo "5. Add to GitHub secrets as ${{ matrix.webhook_secret }}"
            exit 0
          fi

          echo "🚀 Triggering deployment for ${{ matrix.app }}..."
          echo "Service: ${{ matrix.service }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
            echo "✅ Successfully triggered deployment for ${{ matrix.app }}"
            echo "Portainer is now pulling the latest image and restarting ${{ matrix.service }}"
          else
            echo "❌ Failed to trigger deployment for ${{ matrix.app }}"
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 45 seconds for deployment to complete..."
          sleep 45

      - name: Deployment summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Service: ${{ matrix.app }}"
          echo "Image: ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest"
          echo "Status: ${{ job.status }}"
          echo ""
          echo "ℹ️  Check Portainer UI for detailed deployment status"
          echo "ℹ️  Verify service health at the appropriate endpoint"
