name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (leave empty for all)'
        required: false
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed
    branches:
      - main

# Permissions needed for deployment
permissions:
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      apps: ${{ steps.set-apps.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine apps to deploy
        id: set-apps
        run: |
          if [[ "${{ github.event.inputs.app }}" != "" ]]; then
            # Deploy specific app from workflow_dispatch
            APPS_JSON="[\"${{ github.event.inputs.app }}\"]"
          else
            # Find all apps with Dockerfiles
            APPS_JSON=$(find apps -name "Dockerfile" -type f | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "apps=${APPS_JSON}" >> $GITHUB_OUTPUT
          echo "Apps to deploy: ${APPS_JSON}"

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.prepare.outputs.apps) }}
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          APP_NAME="${{ matrix.app }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}/${APP_NAME}:latest"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Deploying ${APP_NAME} using image ${IMAGE_NAME}"

      # Database migrations have been removed from the workflow
