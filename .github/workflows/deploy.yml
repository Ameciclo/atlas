name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (leave empty for all)"
        required: false
        type: string
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed
    branches:
      - main

# Permissions needed for deployment
permissions:
  contents: read
  actions: read

jobs:
  detect_deployed_apps:
    name: Detect Apps to Deploy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_deployments: ${{ steps.set-matrix.outputs.has_deployments }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install turbo
        run: npm install -g turbo

      - name: Determine apps to deploy
        id: set-matrix
        run: |
          # Define all apps with webhooks
          ALL_APPS='[
            {"app": "cyclist-profile", "webhook_secret": "PORTAINER_WEBHOOK_CYCLIST_PROFILE"},
            {"app": "docs", "webhook_secret": "PORTAINER_WEBHOOK_DOCS"}
          ]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual deployment
            if [[ "${{ github.event.inputs.app }}" != "" ]]; then
              # Deploy specific app
              DEPLOY_MATRIX=$(echo $ALL_APPS | jq -c --arg app "${{ github.event.inputs.app }}" '[.[] | select(.app == $app)]')
            else
              # Deploy all apps
              DEPLOY_MATRIX=$ALL_APPS
            fi
          else
            # Automatic deployment after Docker build
            # Detect which apps were actually built

            # Get list of all apps with Dockerfiles
            APPS_WITH_DOCKER=$(find apps -name "Dockerfile" -type f | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

            # Get list of affected apps (same logic as docker.yml)
            BASE_REF="HEAD^1"
            AFFECTED_APPS=$(npx turbo run build --dry-run=json --filter=...[HEAD^1] 2>/dev/null | jq -c '.tasks | map(.taskId | split(":")[0] | select(startswith("@atlas/"))) | map(sub("@atlas/"; "")) | unique' || echo '[]')

            # Filter to only include apps with Dockerfiles that were affected
            AFFECTED_DOCKER_APPS=$(echo $APPS_WITH_DOCKER | jq --argjson affected "$AFFECTED_APPS" -c '[.[] | select($affected | index(.))]')

            # Map to deployment matrix format
            DEPLOY_MATRIX=$(echo $ALL_APPS | jq -c --argjson affected "$AFFECTED_DOCKER_APPS" '[.[] | select($affected | index(.app))]')
          fi

          echo "matrix=${DEPLOY_MATRIX}" >> $GITHUB_OUTPUT

          # Check if we have any deployments
          if [ "$(echo $DEPLOY_MATRIX | jq 'length')" -gt 0 ]; then
            echo "has_deployments=true" >> $GITHUB_OUTPUT
            echo "✅ Will deploy: $(echo $DEPLOY_MATRIX | jq -r '[.[].app] | join(", ")')"
          else
            echo "has_deployments=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No apps to deploy"
          fi

  deploy:
    name: Deploy ${{ matrix.app }} via Portainer Webhook
    needs: detect_deployed_apps
    if: needs.detect_deployed_apps.outputs.has_deployments == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect_deployed_apps.outputs.matrix) }}
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Trigger Portainer Webhook
        run: |
          WEBHOOK_URL="${{ secrets[matrix.webhook_secret] }}"

          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️  Warning: Webhook URL not configured for ${{ matrix.app }}"
            echo "Please set ${{ matrix.webhook_secret }} in GitHub secrets"
            exit 0
          fi

          echo "🚀 Triggering deployment for ${{ matrix.app }}..."
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
            echo "✅ Successfully triggered deployment for ${{ matrix.app }}"
            echo "Portainer is now pulling the latest image and restarting the service"
          else
            echo "❌ Failed to trigger deployment for ${{ matrix.app }}"
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 30 seconds for deployment to complete..."
          sleep 30

      - name: Deployment summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Service: ${{ matrix.app }}"
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "Image: ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest"
          echo "Status: ${{ job.status }}"
          echo ""
          echo "ℹ️  Check Portainer UI for detailed deployment status"
          echo "ℹ️  Verify service health at the appropriate endpoint"
