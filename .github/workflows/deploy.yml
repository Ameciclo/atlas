name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Build and push cyclist-profile
        run: |
          docker build -t cyclist-profile -f apps/cyclist-profile/Dockerfile .
          docker tag cyclist-profile ${{ secrets.DOCKERHUB_USERNAME }}/cyclist-profile:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cyclist-profile:${{ github.sha }}

      # Add more apps here as needed
      # - name: Build and push another-app
      #   run: |
      #     docker build -t another-app -f apps/another-app/Dockerfile .
      #     docker tag another-app ${{ secrets.DOCKERHUB_USERNAME }}/another-app:${{ github.sha }}
      #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/another-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/cyclist-profile
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
