name: Docker Build & Push

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

# Permissions needed for GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  detect_changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install turbo
        run: npm install -g turbo

      - name: Detect changed apps with Dockerfiles
        id: set-matrix
        run: |
          # Get list of all apps with Dockerfiles
          APPS_WITH_DOCKER=$(find apps -name "Dockerfile" -type f | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # If this is a PR, use the base branch for comparison
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
            TURBO_REF="origin/${{ github.base_ref }}"
          else
            # For push to main, use the previous commit
            BASE_REF="HEAD^1"
            TURBO_REF="HEAD^1"
          fi

          # Check if workflow files or OpenAPI-related files changed
          WORKFLOW_CHANGED=$(git diff --name-only $BASE_REF HEAD | grep -E '\.github/workflows/(docker|ci)\.yml|turbo\.json|apps/.*/src/generate-openapi\.ts|apps/docs/public/openapi/' || echo "")

          # Get list of affected apps (with proper error handling)
          TURBO_OUTPUT=$(npx turbo run build --dry-run=json --filter=...[$TURBO_REF] 2>/dev/null || echo '{"tasks":[]}')
          AFFECTED_APPS=$(echo "$TURBO_OUTPUT" | jq -c '.tasks | map(.taskId | split(":")[0] | select(startswith("@atlas/"))) | map(sub("@atlas/"; "")) | unique')

          echo "Affected apps: $AFFECTED_APPS"
          echo "Workflow changed: $WORKFLOW_CHANGED"

          # Filter to only include apps with Dockerfiles that were affected
          AFFECTED_DOCKER_APPS=$(echo "$APPS_WITH_DOCKER" | jq --argjson affected "$AFFECTED_APPS" -c '[.[] | select($affected | index(.))]')

          # If workflow/OpenAPI files changed, rebuild all apps
          if [ -n "$WORKFLOW_CHANGED" ]; then
            echo "Workflow or OpenAPI-related files changed, building all apps"
            AFFECTED_DOCKER_APPS=$APPS_WITH_DOCKER
          # Otherwise, always include docs app if any service changes
          elif [ "$(echo "$AFFECTED_DOCKER_APPS" | jq 'index("docs")')" = "null" ] && [ "$(echo "$AFFECTED_APPS" | jq 'length')" -gt 0 ]; then
            echo "Adding docs app to build (aggregates OpenAPI specs from all services)"
            AFFECTED_DOCKER_APPS=$(echo "$AFFECTED_DOCKER_APPS" | jq -c '. + ["docs"] | unique')
          fi

          # Set outputs
          echo "matrix=${AFFECTED_DOCKER_APPS}" >> $GITHUB_OUTPUT

          # Check if we have any changes
          if [ "$(echo "$AFFECTED_DOCKER_APPS" | jq 'length')" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

          echo "Detected changes in the following apps with Dockerfiles: ${AFFECTED_DOCKER_APPS}"

  build_and_push:
    name: Build & Push Docker Images
    needs: detect_changes
    if: needs.detect_changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect_changes.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for OpenAPI generation)
        if: matrix.app == 'docs'
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm (for OpenAPI generation)
        if: matrix.app == 'docs'
        uses: pnpm/action-setup@v4

      - name: Install dependencies (for OpenAPI generation)
        if: matrix.app == 'docs'
        run: pnpm install --no-frozen-lockfile

      - name: Generate OpenAPI specs
        if: matrix.app == 'docs'
        run: pnpm run generate-openapi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # Note: For private repositories, you need to ensure GITHUB_TOKEN has the right permissions
        # or use a personal access token (PAT) with appropriate permissions stored in secrets

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
