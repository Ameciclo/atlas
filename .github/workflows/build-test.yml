name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/lint.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/lint.yml"
      - ".github/workflows/deploy.yml"

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      affected-apps: ${{ steps.affected-apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for Turborepo

      - name: Check if build is needed
        if: github.event_name == 'pull_request'
        run: |
          npx turbo-ignore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI specs
        run: pnpm generate-openapi

      - name: Show changed files
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}
          echo "Changed files:"
          git diff --name-only origin/$BASE_REF...HEAD

      - name: Determine affected packages
        id: affected-apps
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}

          # Get all affected packages using --affected
          AFFECTED_ALL=$(pnpm turbo run build --dry-run --affected -- --from=origin/$BASE_REF | grep -o '@atlas/[a-z-]*' | sort | uniq)

          # Extract apps (packages in the apps directory)
          AFFECTED_APPS=$(echo "$AFFECTED_ALL" | grep -v "@atlas/typescript-config" | sed 's/@atlas\///' | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # Store results
          echo "apps=$AFFECTED_APPS" >> $GITHUB_OUTPUT
          echo "Affected apps: $AFFECTED_APPS"
          echo "All affected packages: $AFFECTED_ALL"

      - name: Run build for affected packages
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}
          pnpm turbo run build --affected -- --from=origin/$BASE_REF

      - name: Run tests for affected packages
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}
          pnpm turbo run test --affected -- --from=origin/$BASE_REF

      - name: Upload OpenAPI specs
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs
          path: apps/docs/public/openapi/*.json
          if-no-files-found: error
