name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node & PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm format

      - name: Run lint
        run: pnpm lint

      - name: Run type‐check
        run: pnpm check-types

      - name: Run build
        run: pnpm build

      - name: Run tests
        run: pnpm test
