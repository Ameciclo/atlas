name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  code_style:
    name: Code Style & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping code style checks."
          exit 0
      - name: Run biome check
        run: pnpm biome:ci
      - name: Run type-check
        run: pnpm check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping tests."
          exit 0
      - name: Run tests on affected apps/packages
        run: pnpm test --affected

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping builds."
          exit 0
      - name: Run build on affected apps/packages
        run: pnpm build --affected
