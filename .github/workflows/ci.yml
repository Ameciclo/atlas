name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      affected-apps: ${{ steps.affected-apps.outputs.apps }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for Turborepo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm format

      - name: Run lint
        run: pnpm lint

      - name: Run type‐check
        run: pnpm check-types

      - name: Generate OpenAPI specs
        run: pnpm generate-openapi

      - name: Show changed files
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}
          echo "Changed files:"
          git diff --name-only origin/$BASE_REF...HEAD

      - name: Determine affected apps
        id: affected-apps
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}
          # Use --affected flag with base comparison
          AFFECTED=$(pnpm turbo run build --dry-run --affected --filter="./apps/*" -- --from=origin/$BASE_REF | grep -o 'apps/[a-z-]*' | sort | uniq | sed 's/apps\///' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected apps: $AFFECTED"

      - name: Run build for affected packages
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}
          pnpm build --affected -- --from=origin/$BASE_REF

      - name: Run tests for affected packages
        run: |
          BASE_REF=${{ github.event.pull_request.base.ref || 'main' }}
          pnpm test --affected -- --from=origin/$BASE_REF

      - name: Upload OpenAPI specs
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs
          path: apps/docs/public/openapi/*.json
          if-no-files-found: error

  build-push-docs:
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.build-test.outputs.affected-apps), 'docs')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenAPI specs
        uses: actions/download-artifact@v4
        with:
          name: openapi-specs
          path: apps/docs/public/openapi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/docs
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-cyclist-profile:
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.build-test.outputs.affected-apps), 'cyclist-profile')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cyclist-profile
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/cyclist-profile/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
