name: CI/CD Pipeline
# Runs on push to main and pull requests
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions
permissions:
  contents: write # Needed to commit OpenAPI specs

jobs:
  code_style:
    name: Code Style & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping code style checks."
          exit 0
      - name: Run biome check
        run: pnpm biome:ci
      - name: Run type-check
        run: pnpm check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping tests."
          exit 0

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas
        run: pnpm --filter @atlas/database db:migrate

      - name: Run tests on affected apps/packages
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas
        run: pnpm test --affected

  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas
        run: |
          # Only run migrations if migrations folder exists and has files
          if [ -d "packages/database/src/migrations" ] && [ "$(ls -A packages/database/src/migrations/*.sql 2>/dev/null)" ]; then
            pnpm --filter @atlas/database db:migrate
          else
            echo "No migrations to run, skipping..."
          fi

      - name: Run build on affected apps/packages
        if: steps.setup.outputs.skip != 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas
          API_BASE_URL: https://api.ameciclo.org/cyclist-profile
        run: pnpm build --affected

      # Upload build artifacts for use in other jobs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 1
          if-no-files-found: ignore

      # Validate OpenAPI specifications
      - name: Validate OpenAPI specs
        if: steps.setup.outputs.skip != 'true'
        run: pnpm openapi:validate

  # Dependency Review and CodeQL Analysis removed as they're paid features for private repositories
