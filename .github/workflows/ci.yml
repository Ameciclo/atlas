name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_style:
    name: Code Style & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping code style checks."
          exit 0
      - name: Run biome check
        run: pnpm biome:ci
      - name: Run type-check
        run: pnpm check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping tests."
          exit 0
      - name: Run tests on affected apps/packages
        run: pnpm test --affected

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        id: setup
      - name: Skip if no changes
        if: steps.setup.outputs.skip == 'true'
        run: |
          echo "💤 No workspaces changed; skipping builds."
          exit 0
      - name: Run build on affected apps/packages
        run: pnpm build --affected

      # Upload build artifacts for potential use in other jobs
      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v3

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
