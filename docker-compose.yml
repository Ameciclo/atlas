# Shared development database for all Atlas services
# This provides a single PostgreSQL database with PostGIS extension
# All services share the same database (atlas_dev) using the public schema

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: atlas-postgres
    platform: linux/amd64 # For ARM64 Macs - use Rosetta emulation
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    command: [
      "postgres",
      "-c", "max_connections=300",
      "-c", "shared_buffers=256MB"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: atlas-postgres-data
