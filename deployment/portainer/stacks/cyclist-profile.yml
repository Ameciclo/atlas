version: '3.8'

# Atlas Cyclist Profile Service Stack
# API service for managing cyclist profiles

services:
  cyclist-profile:
    image: ghcr.io/ameciclo/atlas/cyclist-profile:${IMAGE_TAG:-latest}
    container_name: atlas-cyclist-profile
    
    environment:
      # Node environment
      NODE_ENV: production
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Server configuration
      PORT: ${PORT:-3000}
      
      # Database connection
      # Uses the shared atlas database with cyclist_profile schema
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@atlas-postgres:5432/atlas
      
      # Optional: Custom configuration
      # API_KEY: ${API_KEY}
      # CORS_ORIGIN: ${CORS_ORIGIN}
    
    ports:
      # Expose API port
      - "${PORT:-3000}:${PORT:-3000}"
    
    networks:
      - atlas-network
    
    restart: unless-stopped
    
    # Wait for database to be healthy
    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-3000}/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  atlas-network:
    external: true

