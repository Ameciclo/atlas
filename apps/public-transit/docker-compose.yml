services:
  app:
    image: atlas-public-transit
    build:
      context: ../..
      dockerfile: ./apps/public-transit/Dockerfile
    ports:
      - "${PORT:-3022}:${PORT:-3022}"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=${PORT:-3022}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=public-transit_db
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/public-transit_db
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3022/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  migrate:
    image: atlas-public-transit
    build:
      context: ../..
      dockerfile: ./apps/public-transit/Dockerfile
    command: node apps/public-transit/dist/db/migrate.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=public-transit_db
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/public-transit_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  seed:
    image: atlas-public-transit
    build:
      context: ../..
      dockerfile: ./apps/public-transit/Dockerfile
    command: node apps/public-transit/dist/db/seed.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=public-transit_db
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/public-transit_db
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    profiles:
      - with-seed

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=public-transit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
