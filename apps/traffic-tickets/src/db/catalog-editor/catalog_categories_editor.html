.toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

.btn-save { background: #0f3460; color: #eee; }

.btn-reset { background: #533483; color: #eee; }

th:nth-child(2) { width: 46px; }
th:nth-child(3) { width: 150px; }

th:nth-child(6) { width: 170px; }
th:nth-child(7) { width: 50px; }
td { padding: 5px 8px; border-bottom: 1px solid #1a1a2e; vertical-align: middle; }
tr { transition: background 0.15s; }
tr:hover { filter: brightness(1.2); }
tr.drag-over { outline: 2px solid #e94560; outline-offset: -1px; }
.cat-cell { cursor: pointer; font-weight: 600; font-size: 12px; white-space: nowrap; }
.desc-cell { cursor: text; transition: background 0.15s; border-radius: 3px; }
.desc-cell:hover { background: #1a2d4a; }
.desc-cell:focus { outline: 2px solid #e94560; outline-offset: -2px; background: #0f1a2e; }
.icon-picker { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.icon-btn { padding: 3px 8px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; transition: all 0.15s; }
.icon-btn:hover { filter: brightness(1.4); transform: scale(1.05); }
.icon-btn.sel { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.3); }
.icon-btn.add { border: 2px dashed #666; background: transparent; color: #888; font-style: italic; }
.cat-pedestres { background: #4a2511; color: #ffab76; }
.cat-ciclistas { background: #1d3a2c; color: #7bed9f; }
.cat-velocidade { background: #3d1a3d; color: #e77fe7; }

.cat-circulacao { background: #1d2c3a; color: #7ec8e3; }
.cat-conducao { background: #1a2d4a; color: #82b1ff; }
.cat-condicoes { background: #3a2a1d; color: #f0c060; }
.cat-outros { background: #2a2a3a; color: #b0b0b0; }
.quick-cell { text-align: center; white-space: nowrap; }
.quick-icon { display: inline-block; padding: 2px 4px; border-radius: 4px; cursor: pointer; font-size: 15px; transition: all 0.15s; opacity: 0.45; }
.quick-icon:hover { opacity: 1; transform: scale(1.2); }
.quick-icon.on { opacity: 1; outline: 1px solid rgba(255,255,255,0.4); outline-offset: 1px; }
.var-badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; cursor: pointer; background: #2a2a4a; color: #aaa; white-space: nowrap; }
.var-badge:hover { background: #3a3a6a; color: #fff; }
.var-badge.has { background: #2a3a4a; color: #82b1ff; }
.var-badge.has:hover { background: #3a4a6a; }
.var-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.var-item + .var-item { border-top: 1px solid #1a1a2e; padding-top: 4px; margin-top: 2px; }
.var-text { flex: 1; font-size: 11px; color: #ccc; word-break: break-word; }
.variant-inline { border-top: 1px solid #1a1a2e; margin-top: 4px; }
.var-text:focus { outline: none; background: #1a2a4a; border-radius: 3px; padding: 1px 4px; color: #fff; }
.btn-sm { padding: 2px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 10px; font-weight: 600; white-space: nowrap; }
.btn-sm.del { background: #4a1a1a; color: #f88; }
.btn-sm.del:hover { background: #6a2a2a; }
.btn-sm.split { background: #1a3a2a; color: #8f8; }
.btn-sm.split:hover { background: #2a5a3a; }
.btn-sm.edit { background: #2a2a4a; color: #aaf; }
.btn-sm.edit:hover { background: #3a3a6a; }
.btn-sm.addvar { background: #2a3a1a; color: #af8; }
.btn-sm.addvar:hover { background: #3a5a2a; }
.stats { font-size: 12px; color: #888; margin-bottom: 8px; }
.drag-hint { font-size: 11px; color: #666; margin-left: 8px; }
</style>
</head>

<h1>Editor de Categorias - Infracoes CAT</h1>

  'Pedestres': '🚶', 'Ciclistas': '🚲', 'Velocidade': '⚡',

  'Risco a vulneráveis': '🚶', 'Conduta de vulneráveis': '🚲',
};
const CAT_CLASS = {
  'Pedestres': 'cat-pedestres', 'Ciclistas': 'cat-ciclistas', 'Velocidade': 'cat-velocidade',
  'Parada e Estacionamento': 'cat-parada',
  'Conduta do Condutor': 'cat-conducao', 'Regras de Circulação': 'cat-circulacao',
  'Regularidade do veículo': 'cat-condicoes',
  'Outros': 'cat-outros', 'Outros deveres legais': 'cat-outros',
  'Risco a vulneráveis': 'cat-pedestres', 'Conduta de vulneráveis': 'cat-ciclistas',
};
function catIcon(cat) { return CAT_ICONS[cat] || '📋'; }
function catClass(cat) { return CAT_CLASS[cat] || 'cat-outros'; }
const QUICK_ICONS = [
  { icon: '🚶', cat: 'Risco a vulneráveis' }, { icon: '🚲', cat: 'Conduta de vulneráveis' },
  { icon: '⚡', cat: 'Velocidade' }, { icon: '🅿️', cat: 'Parada e Estacionamento' },
  { icon: '↔️', cat: 'Regras de Circulação' }, { icon: '👤', cat: 'Conduta do Condutor' },
  { icon: '🚗', cat: 'Regularidade do veículo' }, { icon: '📋', cat: 'Outros deveres legais' },
];

let data = [];
const categories = [];
const filterCat = document.getElementById('filterCat');

function initData(loaded) {
  data = loaded;
  // Refresh categories
  categories.length = 0;
  var cats = [...new Set(data.map(function(d) { return d.category; }).filter(Boolean))].sort();
  cats.forEach(function(c) { categories.push(c); });
  refreshFilter();
  render();
}

function loadFromServer(cb) {
  fetch('/catalog_categories.json')
    .then(function(r) { return r.json(); })
    .then(function(d) { cb(d); })
    .catch(function() { cb(JSON.parse(JSON.stringify(ORIGINAL))); });
}

loadFromServer(initData);

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const catFilter = filterCat.value;
  const filtered = data.filter((d, i) => {
    d._idx = i;
    const inDesc = d.canonical_description.toLowerCase().includes(search);
    const inCode = d.law_code.toLowerCase().includes(search);
    const inVar = (d.known_variants || []).some(v => v.toLowerCase().includes(search));
    const matchSearch = !search || inCode || inDesc || inVar;
    const matchCat = !catFilter || d.category === catFilter;
    return matchSearch && matchCat;
  });
  document.getElementById('stats').textContent = filtered.length + ' de ' + data.length + ' itens';

  const tbody = document.getElementById('tbody');
  let rows = '';
  filtered.forEach((d, fi) => {
    const vcount = (d.known_variants || []).length;
    const vbadge = vcount > 0
      ? '<span class="var-badge has" data-idx="' + d._idx + '">' + vcount + '</span>'
      : '<span class="var-badge" data-idx="' + d._idx + '">0</span>';
    const quickIcons = QUICK_ICONS.map(q => {
      const on = d.category === q.cat || d.category === (q.cat + ' ');
      return '<span class="quick-icon ' + (on ? 'on' : '') + '" data-cat="' + esc(q.cat) + '">' + q.icon + '</span>';
    }).join('');
    rows += '<tr data-idx="' + d._idx + '" class="main-row">' +
      '<td style="text-align:center"><input type="checkbox" class="row-sel" data-idx="' + d._idx + '" onchange="onSelChange()"></td>' +
      '<td style="text-align:center">' + (fi + 1) + '</td>' +
      '<td style="white-space:nowrap;font-size:12px" class="desc-cell" contenteditable="true" data-idx="' + d._idx + '" data-field="law_code" spellcheck="false">' + esc(d.law_code) + '</td>' +
      '<td style="font-size:12px"><span class="desc-cell" contenteditable="true" data-idx="' + d._idx + '" data-field="canonical_description" spellcheck="false">' + esc(d.canonical_description) + '</span><div class="variant-inline" id="vars-' + d._idx + '" style="display:none;padding-top:6px"></div></td>' +
      '<td class="cat-cell ' + catClass(d.category) + '" data-idx="' + d._idx + '">' + catIcon(d.category) + ' ' + esc(d.category) + '</td>' +
      '<td class="quick-cell">' + quickIcons + '</td>' +
      '<td style="text-align:center">' + vbadge + ' <span class="btn-sm del" onclick="deleteEntry(event,' + d._idx + ')" style="cursor:pointer;margin-left:2px">✕</span></td>' +
      '</tr>';
  });
  tbody.innerHTML = rows;

  document.querySelectorAll('.cat-cell').forEach(td => td.addEventListener('click', onCatClick));
  document.querySelectorAll('.quick-icon').forEach(icon => icon.addEventListener('click', onQuickIconClick));
  document.querySelectorAll('.var-badge').forEach(badge => badge.addEventListener('click', onVarBadgeClick));
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderVariants(idx) {
  const container = document.getElementById('vars-' + idx);
  if (!container) return;
  const d = data[idx];
  const variants = d.known_variants || [];
  container.innerHTML = variants.map((v, vi) =>
    '<div class="var-item">' +
      '<span class="var-text" contenteditable="true" data-idx="' + idx + '" data-vi="' + vi + '" onblur="onVariantEdit(this,' + idx + ',' + vi + ')">' + esc(v) + '</span>' +
      '<button class="btn-sm split" onclick="splitVariant(' + idx + ',' + vi + ')">dividir</button>' +
      '<button class="btn-sm del" onclick="deleteVariant(' + idx + ',' + vi + ')">x</button>' +
    '</div>'
  ).join('') +
  '<div class="var-item" style="padding-top:4px"><button class="btn-sm addvar" onclick="addVariant(' + idx + ')">+ variante</button></div>';
}

function onVarBadgeClick(e) {
  e.stopPropagation();
  const idx = parseInt(e.target.dataset.idx);
  const div = document.getElementById('vars-' + idx);
  if (!div) return;
  if (div.style.display === 'none') {
    div.style.display = 'block';
    renderVariants(idx);
  } else {
    div.style.display = 'none';
  }
}

function onVariantEdit(el, idx, vi) {
  const newText = el.textContent.trim();
  if (newText && newText !== data[idx].known_variants[vi]) data[idx].known_variants[vi] = newText;
}

function deleteVariant(idx, vi) {
  if (!confirm('Remover esta variante?')) return;
  data[idx].known_variants.splice(vi, 1);
  renderVariants(idx);
  updateBadge(idx);
}

function addVariant(idx) {
  const text = prompt('Nova variante:');
  if (text !== null && text.trim()) {
    if (!data[idx].known_variants) data[idx].known_variants = [];
    data[idx].known_variants.push(text.trim());
    renderVariants(idx);
    updateBadge(idx);
  }
}

function updateBadge(idx) {
  const badge = document.querySelector('.var-badge[data-idx="' + idx + '"]');
  if (badge) {
    const cnt = data[idx].known_variants.length;
    badge.textContent = cnt;
    badge.className = 'var-badge' + (cnt > 0 ? ' has' : '');
  }
}

function splitVariant(idx, vi) {
  const variant = data[idx].known_variants[vi];
  if (!confirm('Criar nova entrada com:\n"' + variant + '"\n\nMesmo artigo e categoria?')) return;
  const src = data[idx];
  data.push({ law_code: src.law_code, canonical_description: variant, category: src.category, known_variants: [] });
  data[idx].known_variants.splice(vi, 1);
  render();
}

function deleteEntry(e, idx) {
  e.stopPropagation();
  const d = data[idx];
  if (!confirm('Apagar:\n\n' + d.law_code + '\n' + d.canonical_description + '\n\nTem certeza?')) return;
  data.splice(idx, 1);
  render();
}

function addNewEntry() {
  const lc = prompt('Artigo (ex: Art. 162, Inc. I):');
  if (!lc || !lc.trim()) return;
  const desc = prompt('Descricao canonica:');
  if (!desc || !desc.trim()) return;
  const cat = prompt('Categoria:', categories[0] || '');
  if (!cat || !cat.trim()) return;
  data.push({ law_code: lc.trim(), canonical_description: desc.trim(), category: cat.trim(), known_variants: [] });
  if (!categories.includes(cat.trim())) { categories.push(cat.trim()); categories.sort(); refreshFilter(); }
  render();
}

let allVariantsOpen = false;

function toggleAllVariants() {
  allVariantsOpen = !allVariantsOpen;
  document.querySelectorAll('.variant-inline').forEach(function(div) {
    if (allVariantsOpen) {
      div.style.display = 'block';
      var idx = parseInt(div.id.replace('vars-', ''));
      if (!div.querySelector('.var-item')) renderVariants(idx);
    } else {
      div.style.display = 'none';
    }
  });
  document.querySelectorAll('button').forEach(function(b) {
    if (b.textContent === 'Expandir variantes' || b.textContent === 'Contrair variantes')
      b.textContent = allVariantsOpen ? 'Contrair variantes' : 'Expandir variantes';
  });
}

function getSelected() {
  const cbs = document.querySelectorAll('.row-sel:checked');
  return Array.from(cbs).map(cb => parseInt(cb.dataset.idx)).sort((a,b) => a-b);
}

function onSelChange() {
  const sel = getSelected();
  document.getElementById('btnMerge').style.display = sel.length >= 2 ? '' : 'none';
}

function mergeSelected() {
  const sel = getSelected();
  if (sel.length < 2) return;
  const targetIdx = sel[0];
  const sources = sel.slice(1);
  const target = data[targetIdx];
  const sourceData = sources.map(si => data[si]);
  const allDescs = [target.canonical_description];
  sourceData.forEach(src => { if (!allDescs.includes(src.canonical_description)) allDescs.push(src.canonical_description); });

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:20px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto';
  box.innerHTML = '<h3 style="margin-bottom:12px;color:#e94560">Juntar ' + sel.length + ' entradas</h3>' +
    '<p style="font-size:12px;color:#aaa;margin-bottom:8px">Escolha a descricao canonica do item resultante:</p>' +
    allDescs.map((d, i) => '<label style="display:flex;align-items:flex-start;gap:8px;padding:8px;margin:4px 0;border-radius:6px;cursor:pointer;font-size:12px" onmouseenter="this.style.background=\'#1a2d4a\'" onmouseleave="this.style.background=\'\'">' +
      '<input type="radio" name="merge-desc" value="' + i + '" ' + (i===0?'checked':'') + ' style="margin-top:2px">' +
      '<span style="flex:1">' + esc(d) + '</span></label>').join('') +
    '<label style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer;font-size:12px;margin-top:12px;border-top:1px solid #333;padding-top:12px" onmouseenter="this.style.background=\'#1a2d4a\'" onmouseleave="this.style.background=\'\'">' +
      '<input type="radio" name="merge-desc" value="custom" style="margin-top:0">' +
      '<span>Novo texto:</span>' +
      '<input type="text" id="merge-custom-text" style="flex:1;padding:4px 8px;border-radius:4px;border:1px solid #444;background:#0a0e1a;color:#eee;font-size:12px" placeholder="Digite a nova descricao...">' +
    '</label>' +
    '<div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">' +
      '<button class="btn-reset" onclick="this.closest(\'div\').parentElement.remove()">Cancelar</button>' +
      '<button class="btn-save" id="merge-confirm">Juntar</button></div>';
  document.body.appendChild(overlay);
  overlay.appendChild(box);

  document.getElementById('merge-confirm').onclick = function() {
    const radio = box.querySelector('input[name="merge-desc"]:checked');
    if (!radio) return;
    var chosen;
    if (radio.value === 'custom') {
      chosen = box.querySelector('#merge-custom-text').value.trim();
      if (!chosen) return;
    } else {
      chosen = allDescs[parseInt(radio.value)];
    }
    overlay.remove();
    target.canonical_description = chosen;
    if (!target.known_variants) target.known_variants = [];
    const allVars = new Set(target.known_variants);
    allDescs.forEach(function(d) { if (d !== chosen) allVars.add(d); });
    sourceData.forEach(function(src) { (src.known_variants || []).forEach(function(v) { allVars.add(v); }); });
    target.known_variants = Array.from(allVars);
    sources.slice().sort(function(a,b){return b-a}).forEach(function(si) { data.splice(si, 1); });
    render();
  };
}

let openPickerTd = null;

function onCatClick(e) {
  const td = e.target.closest('.cat-cell');
  if (!td || td === openPickerTd || td.querySelector('.icon-picker')) return;
  const idx = parseInt(td.dataset.idx);
  const current = data[idx].category;
  const picker = document.createElement('div');
  picker.className = 'icon-picker';
  const allCats = categories.slice();
  if (!allCats.includes(current)) allCats.push(current);
  allCats.sort();
  allCats.forEach(function(c) {
    const btn = document.createElement('span');
    btn.className = 'icon-btn ' + catClass(c);
    if (c === current) btn.classList.add('sel');
    btn.textContent = catIcon(c) + ' ' + c;
    btn.addEventListener('click', function(ev) {
      ev.stopPropagation(); ev.preventDefault();
      data[idx].category = c;
      openPickerTd = null;
      render();
    });
    picker.appendChild(btn);
  });
  const addBtn = document.createElement('span');
  addBtn.className = 'icon-btn add';
  addBtn.textContent = '+ nova';
  addBtn.addEventListener('click', function(ev) {
    ev.stopPropagation(); ev.preventDefault();
    const newCat = prompt('Nova categoria:', current);
    if (newCat !== null && newCat.trim()) {
      data[idx].category = newCat.trim();
      if (!categories.includes(newCat.trim())) { categories.push(newCat.trim()); categories.sort(); refreshFilter(); }
      openPickerTd = null;
      render();
    }
  });
  picker.appendChild(addBtn);
  td.textContent = '';
  td.appendChild(picker);
  openPickerTd = td;
}

function onQuickIconClick(e) {
  e.stopPropagation(); e.preventDefault();
  const icon = e.target.closest('.quick-icon');
  if (!icon) return;
  const cat = icon.dataset.cat;
  const tr = icon.closest('tr');
  if (!tr) return;
  data[parseInt(tr.dataset.idx)].category = cat;
  openPickerTd = null;
  render();
}

document.addEventListener('focusout', function(ev) {
  const td = ev.target.closest('.desc-cell');
  if (!td) return;
  const idx = parseInt(td.dataset.idx);
  const field = td.dataset.field;
  const txt = td.textContent.trim();
  if (txt && txt !== data[idx][field]) data[idx][field] = txt;
});

document.addEventListener('click', function(ev) {
  if (openPickerTd && !openPickerTd.contains(ev.target)) { openPickerTd = null; render(); }
});

function refreshFilter() {
  const val = filterCat.value;
  filterCat.innerHTML = '<option value="">Todas categorias</option>';
  categories.forEach(function(c) {
    const o = document.createElement('option');
    o.value = c; o.textContent = catIcon(c) + ' ' + c;
    filterCat.appendChild(o);
  });
  filterCat.value = val;
}

function saveJSON() {
  const clean = data.map(function(d) { return { law_code: d.law_code, canonical_description: d.canonical_description, category: d.category, known_variants: d.known_variants || [] }; });
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    fetch('/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(clean) })
      .then(function(r) { return r.json(); })
      .then(function(res) { if (res.ok) alert('Salvo! ' + res.count + ' entradas em catalog_categories.json'); })
      .catch(function(err) { alert('Erro no servidor. Fazendo download...'); downloadJSON(clean); });
    return;
  }
  alert('Modo offline (arquivo local). Fazendo download...');
  downloadJSON(clean);
}

function downloadJSON(clean) {
  const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'catalog_categories.json';
  a.click();
  URL.revokeObjectURL(url);
}

function resetData() {
  if (confirm('Restaurar dados originais? Alteracoes nao salvas serao perdidas.')) {
    loadFromServer(initData);
    document.getElementById('search').value = '';
    filterCat.value = '';
  }
}

document.getElementById('search').addEventListener('input', render);
filterCat.addEventListener('change', render);
</script>
</body>
</html>
