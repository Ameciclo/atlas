<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correcao de Limbo - Traffic Tickets</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: #16213e;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 { color: #e94560; font-size: 16px; }
  .header a { color: #888; font-size: 12px; text-decoration: none; }
  .header a:hover { color: #e94560; }
  .header a.active { color: #e94560; font-weight: bold; }

  .stats-bar {
    background: #0f3460;
    padding: 6px 20px;
    display: flex;
    gap: 18px;
    flex-shrink: 0;
    font-size: 12px;
    color: #888;
    border-bottom: 1px solid #0f3460;
    flex-wrap: wrap;
  }
  .stats-bar span strong { color: #e0e0e0; }

  .filters {
    display: flex;
    gap: 14px;
    padding: 10px 20px;
    background: #1a1a2e;
    flex-shrink: 0;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #0f3460;
  }
  .filters label { font-size: 12px; color: #888; white-space: nowrap; }
  .filters input[type="text"] {
    background: #0f3460;
    border: 1px solid #e94560;
    border-radius: 4px;
    color: #fff;
    padding: 4px 8px;
    font-size: 12px;
    width: 200px;
  }
  .filters select {
    background: #0f3460;
    border: 1px solid #e94560;
    border-radius: 4px;
    color: #fff;
    padding: 4px 8px;
    font-size: 12px;
  }
  .filters input:focus, .filters select:focus { outline: none; border-color: #ff6b8a; }

  .stats-line {
    padding: 6px 20px;
    color: #888;
    font-size: 12px;
    background: #1a1a2e;
    flex-shrink: 0;
  }

  .table-wrap {
    flex: 1;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    position: sticky;
    top: 0;
    background: #16213e;
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
    padding: 7px 8px;
    text-align: left;
    z-index: 1;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: #e0e0e0; }
  td { padding: 6px 8px; border-bottom: 1px solid #16213e; vertical-align: middle; }
  tr:hover { background: #0f346020; }
  tr.limbo { background: #d4a01310; }
  tr.selected { background: #e9456020; }

  .raw-loc { font-size: 12px; max-width: 300px; word-break: break-word; }
  .extracted { font-weight: bold; }
  .vio-count { color: #e94560; font-weight: bold; text-align: right; white-space: nowrap; }
  .badge-sem { background:#d4a013;color:#000;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:bold; }
  .badge-post { background:#7b2ff7;color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:bold; }

  .btn {
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { transform: scale(1.03); }
  .btn:active { transform: scale(0.97); }
  .btn-correct { background: #9b2226; color: white; }
  .btn-ok { background: #2d6a4f; color: white; }
  .btn-skip { background: #495057; color: white; }

  .batch-bar {
    padding: 6px 20px;
    flex-shrink: 0;
    gap: 8px;
    align-items: center;
    border-bottom: 1px solid #0f3460;
    background: #1a1a2e;
    display: none;
    flex-wrap: wrap;
  }
  .batch-bar.active { display: flex; }
  .batch-bar .count { color: #e94560; font-size: 12px; font-weight: bold; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #16213e;
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 { margin-bottom: 12px; color: #e94560; }
  .modal label { font-size: 12px; color: #888; display: block; margin-top: 8px; }
  .modal label:first-of-type { margin-top: 0; }
  .modal input[type="text"] {
    width: 100%;
    background: #0f3460;
    border: 1px solid #e94560;
    border-radius: 6px;
    color: #fff;
    padding: 8px 12px;
    font-size: 14px;
    margin-top: 4px;
  }
  .modal .info-box {
    background: #0f3460;
    padding: 8px;
    border-radius: 6px;
    margin: 4px 0 8px;
    font-size: 13px;
    word-break: break-word;
  }
  .modal .current { border: 1px solid #9b2226; }
  .modal .batch-info {
    background: #0f3460;
    padding: 8px 12px;
    border-radius: 6px;
    margin: 8px 0;
    font-size: 12px;
    color: #e94560;
  }
  .modal textarea {
    width: 100%;
    min-height: 60px;
    background: #0f3460;
    border: 1px solid #e94560;
    border-radius: 6px;
    color: #fff;
    padding: 8px;
    font-family: monospace;
    font-size: 12px;
  }

  .search-wrap { position: relative; }
  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    max-height: 180px;
    overflow-y: auto;
    background: #0f3460;
    border: 1px solid #e94560;
    border-radius: 0 0 6px 6px;
    z-index: 10;
    display: none;
  }
  .search-results.active { display: block; }
  .search-item {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid #16213e;
  }
  .search-item:hover { background: #e94560; }
  .search-item .code { color:#888; font-size:11px; margin-left:6px; }

  .row-checkbox { width:16px; height:16px; accent-color:#e94560; cursor:pointer; margin:0; }
  #select-all { width:16px; height:16px; accent-color:#e94560; cursor:pointer; margin:0; }

  .pagination {
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #1a1a2e;
    border-top: 1px solid #0f3460;
  }
  .pagination span { color: #888; font-size: 12px; }
  .pagination input[type="number"] {
    width: 60px;
    text-align: center;
    background: #0f3460;
    border: 1px solid #e94560;
    border-radius: 4px;
    color: #fff;
    padding: 4px 6px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Correcao de Limbo</h1>
  <div>
    <a href="/">Individual</a> &nbsp;
    <a href="/streets">Por rua</a> &nbsp;
    <a href="/equipment">Equipamentos</a> &nbsp;
    <a href="/limbo" class="active">Limbo</a>
  </div>
</div>

<div class="stats-bar" id="stats-bar">
  <span>Limbo total: <strong id="stat-total">-</strong></span>
  <span>Infracoes: <strong id="stat-violations">-</strong></span>
  <span>Mostrados: <strong id="stat-shown">-</strong></span>
</div>

<div class="filters" id="filters">
  <label><input type="checkbox" id="filt-vio" checked onchange="onFilterChange()"> So com infracoes</label>
  <label><input type="checkbox" id="filt-hide-equip" onchange="onFilterChange()"> Esconder semaforos/postes</label>
  <span style="color:#888;font-size:12px;">Status:</span>
  <label><input type="checkbox" id="filt-st-pending" onchange="onFilterChange()"> Pendentes</label>
  <label><input type="checkbox" id="filt-st-ok" onchange="onFilterChange()"> OK</label>
  <label><input type="checkbox" id="filt-st-corrected" onchange="onFilterChange()"> Corrigidos</label>
  <label><input type="checkbox" id="filt-st-limbo" checked onchange="onFilterChange()"> Limbo</label>
  <label>Tipo:
    <select id="filt-type" onchange="onFilterChange()">
      <option value="">Todos</option>
      <option value="equipment">Equipamentos</option>
      <option value="semaphore">Semaforos</option>
      <option value="post">Postes</option>
    </select>
  </label>
  <label>Rua: <input type="text" id="filt-street" oninput="onFilterChange()" placeholder="codigo da rua..." style="width:100px;"></label>
  <label>Buscar: <input type="text" id="filt-search" oninput="onFilterChange()" placeholder="texto no raw description..." style="width:200px;"></label>
  <select id="filt-words" onchange="onFilterChange()" style="background:#0f3460;border:1px solid #e94560;border-radius:4px;color:#fff;padding:3px 6px;font-size:11px;">
    <option value="0">Todo texto</option>
    <option value="3">3 palavras</option>
    <option value="5" selected>5 palavras</option>
    <option value="8">8 palavras</option>
    <option value="10">10 palavras</option>
  </select>
  <label style="font-size:12px;color:#888;white-space:nowrap;"><input type="checkbox" id="filt-invert" onchange="onFilterChange()"> Inverter</label>
</div>

<div class="stats-line" id="stats-line">Carregando...</div>

<div class="batch-bar" id="batch-bar">
  <span class="count" id="batch-count-label">0 selecionados</span>
  <button class="btn btn-skip" onclick="selectRange()">Selecionar intervalo</button>
  <button class="btn btn-correct" onclick="openBatchCorrection()">Corrigir selecionados</button>
  <button class="btn btn-ok" onclick="batchMarkOK()">OK selecionados</button>
</div>

<div class="table-wrap">
  <table id="data-table">
    <thead>
      <tr>
        <th style="width:30px;padding:0 4px;"><input type="checkbox" id="select-all" onchange="toggleSelectAll()" title="Selecionar todos"></th>
        <th onclick="setSort('id')" style="cursor:pointer;"># <span id="sort-id"></span></th>
        <th onclick="setSort('raw')" style="cursor:pointer;">Raw description <span id="sort-raw"></span></th>
        <th onclick="setSort('extracted')" style="cursor:pointer;">Extracted <span id="sort-extracted"></span></th>
        <th>Tipo</th>
        <th onclick="setSort('vio')" style="cursor:pointer;">Infracoes <span id="sort-vio"></span></th>
        <th>Rua</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="pagination">
  <button class="btn btn-skip" onclick="changePage(-1)">< Anterior</button>
  <span>Pagina <input type="number" id="page-input" value="1" min="1" onchange="goToPage()"> / <span id="page-total">1</span></span>
  <button class="btn btn-skip" onclick="changePage(1)">Proximo ></button>
  <span style="margin-left:12px;">Itens/pag: <select id="limit-select" onchange="onFilterChange()">
    <option value="100">100</option>
    <option value="200" selected>200</option>
    <option value="500">500</option>
    <option value="1000">1000</option>
  </select></span>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Corrigir limbo</h3>
    <div id="modal-batch-info" style="display:none;">
      <label>Itens selecionados (<span id="modal-batch-count">0</span>)</label>
      <div class="batch-list" id="modal-batch-list" style="max-height:120px;overflow-y:auto;background:#0f3460;border-radius:6px;padding:8px;margin:4px 0 8px;font-size:12px;"></div>
    </div>
    <p style="margin-bottom:6px;font-size:12px;color:#888;" id="modal-loc-id"></p>
    <div id="modal-single-info">
      <label>Raw description</label>
      <div class="info-box" id="modal-raw"></div>
      <label>Extracted atual (limbo)</label>
      <div class="info-box current" id="modal-current"></div>
    </div>
    <label>Buscar rua correta</label>
    <div class="search-wrap">
      <input type="text" id="modal-search" placeholder="Nome da rua...">
      <div class="search-results" id="modal-search-results"></div>
    </div>
    <label>Corrected street</label>
    <input type="text" id="modal-corrected-street" placeholder="Selecionado da busca..." readonly>
    <label>Corrected code</label>
    <input type="text" id="modal-corrected-code" placeholder="Selecionado da busca..." readonly>
    <label>Notas</label>
    <textarea id="modal-notes" placeholder="Opcional..."></textarea>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-correct" onclick="confirmCorrection()">Salvar correcao</button>
      <button class="btn btn-ok" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
let allItems = [];
let filteredItems = [];
let currentPage = 1;
let limit = 200;
let sortCol = 'vio';
let sortDir = -1;
let searchTimer = null;
let lastCheckIdx = null;

async function loadData() {
  document.getElementById('stats-line').textContent = 'Carregando...';
  const search = document.getElementById('filt-search').value;
  const type = document.getElementById('filt-type').value;
  const streetCode = document.getElementById('filt-street').value;
  const onlyVio = document.getElementById('filt-vio').checked;
  const hideEquip = document.getElementById('filt-hide-equip').checked;
  const wordLimit = parseInt(document.getElementById('filt-words').value) || 0;
  const invert = document.getElementById('filt-invert').checked;
  limit = parseInt(document.getElementById('limit-select').value) || 200;

  const statusParts = [];
  if (document.getElementById('filt-st-pending').checked) statusParts.push('pending');
  if (document.getElementById('filt-st-ok').checked) statusParts.push('verified');
  if (document.getElementById('filt-st-corrected').checked) statusParts.push('corrected');
  if (document.getElementById('filt-st-limbo').checked) statusParts.push('limbo');
  const status = statusParts.join(',');

  let url = `/api/limbo-locations?sort=${sortCol}&dir=${sortDir === -1 ? 'desc' : 'asc'}&limit=999999&offset=0&status=${encodeURIComponent(status)}`;
  if (search) url += '&search=' + encodeURIComponent(search);
  if (type) url += '&type=' + encodeURIComponent(type);
  if (streetCode) url += '&street_code=' + encodeURIComponent(streetCode);

  const r = await fetch(url);
  const data = await r.json();
  allItems = data.items;

  filteredItems = allItems.slice();

  if (onlyVio) {
    filteredItems = filteredItems.filter(d => (d.violation_count || 0) > 0);
  }

  if (hideEquip) {
    filteredItems = filteredItems.filter(d => d._location_type !== 'semaphore' && d._location_type !== 'post');
  }

  if (wordLimit > 0) {
    const rawSearch = search.toLowerCase();
    filteredItems = filteredItems.filter(d => {
      const rawForSearch = (d.raw_description || '').toLowerCase().split(/\s+/).slice(0, wordLimit).join(' ');
      const match = rawForSearch.includes(rawSearch);
      const eqMatch = rawForSearch.includes(rawSearch);
      if (invert) return !eqMatch;
      return eqMatch;
    });
  }

  updateStats(data);
  goToPage(1);
}

function updateStats(data) {
  document.getElementById('stat-total').textContent = (data.total || 0).toLocaleString();
  document.getElementById('stat-violations').textContent = (data.total_violations || 0).toLocaleString();
  document.getElementById('stat-shown').textContent = filteredItems.length.toLocaleString();
}

function onFilterChange() {
  currentPage = 1;
  loadData();
}

function setSort(col) {
  if (sortCol === col) {
    sortDir = -sortDir;
  } else {
    sortCol = col;
    sortDir = -1;
  }
  loadData();
}

function updateSortIndicators() {
  ['id', 'raw', 'extracted', 'vio'].forEach(c => {
    const el = document.getElementById('sort-' + c);
    if (!el) return;
    el.textContent = (c === sortCol) ? (sortDir === -1 ? ' ▼' : ' ▲') : '';
  });
}

function goToPage(page) {
  if (page === undefined) page = parseInt(document.getElementById('page-input').value) || 1;
  page = Math.max(1, Math.min(page, Math.ceil(filteredItems.length / limit)));
  currentPage = page;
  document.getElementById('page-input').value = page;
  document.getElementById('page-total').textContent = Math.ceil(filteredItems.length / limit) || 1;
  renderTable();
}

function changePage(delta) {
  goToPage(currentPage + delta);
}

function renderTable() {
  updateSortIndicators();
  const start = (currentPage - 1) * limit;
  const pageItems = filteredItems.slice(start, start + limit);

  document.getElementById('stats-line').textContent =
    `Mostrando ${pageItems.length} itens (pag ${currentPage}/${Math.ceil(filteredItems.length / limit) || 1}) | Filtrados: ${filteredItems.length} de ${allItems.length}`;

  document.getElementById('table-body').innerHTML = pageItems.map((d, idx) => {
    const globalIdx = start + idx;
    let typeBadge = '';
    if (d._location_type === 'semaphore') typeBadge = '<span class="badge-sem">SEM</span>';
    else if (d._location_type === 'post') typeBadge = '<span class="badge-post">POST</span>';

    const isChecked = window._checkedSet && window._checkedSet.has(d.location_id) ? 'checked' : '';

    return `<tr class="limbo${isChecked ? ' selected' : ''}">
      <td><input type="checkbox" class="row-checkbox" data-global-idx="${globalIdx}" data-loc-id="${d.location_id}" ${isChecked} onchange="onCheckboxChange(event, ${globalIdx})" onclick="event.stopPropagation()"></td>
      <td>${d.location_id}</td>
      <td class="raw-loc">${esc(d.raw_description)}</td>
      <td class="extracted">${esc(d.extracted_street || '-')}</td>
      <td>${typeBadge}</td>
      <td class="vio-count">${(d.violation_count || 0).toLocaleString()}</td>
      <td style="color:#888;font-size:11px;">${d.street_code || ''}</td>
      <td><button class="btn btn-correct" onclick="openCorrection(${globalIdx})">Corrigir</button>
          <button class="btn btn-ok" onclick="markSingleOK(${globalIdx})">OK</button></td>
    </tr>`;
  }).join('');

  lastCheckIdx = null;
  updateBatchBar();
}

function onCheckboxChange(event, idx) {
  ensureCheckedSet();
  const lid = filteredItems[idx].location_id;
  if (event.target.checked) {
    window._checkedSet.add(lid);
  } else {
    window._checkedSet.delete(lid);
  }
  updateBatchBar();
}

function ensureCheckedSet() {
  if (!window._checkedSet) window._checkedSet = new Set();
}

function toggleSelectAll() {
  ensureCheckedSet();
  const checked = document.getElementById('select-all').checked;
  const start = (currentPage - 1) * limit;
  const pageItems = filteredItems.slice(start, start + limit);
  pageItems.forEach(d => {
    if (checked) window._checkedSet.add(d.location_id);
    else window._checkedSet.delete(d.location_id);
  });
  updateAllPageCheckboxes(pageItems, start);
  updateBatchBar();
}

function updateAllPageCheckboxes(pageItems, start) {
  pageItems.forEach((d, pi) => {
    const gi = start + pi;
    const cb = document.querySelector(`.row-checkbox[data-global-idx="${gi}"]`);
    if (cb) cb.checked = window._checkedSet.has(d.location_id);
  });
}

function updateBatchBar() {
  ensureCheckedSet();
  const count = window._checkedSet.size;
  const bar = document.getElementById('batch-bar');
  if (count > 0) {
    bar.classList.add('active');
    document.getElementById('batch-count-label').textContent = count + ' selecionado' + (count > 1 ? 's' : '');
  } else {
    bar.classList.remove('active');
  }
}

function selectRange() {
  ensureCheckedSet();
  if (window._checkedSet.size < 2) return;

  let minIdx = Infinity;
  let maxIdx = -Infinity;
  filteredItems.forEach((d, i) => {
    if (window._checkedSet.has(d.location_id)) {
      if (i < minIdx) minIdx = i;
      if (i > maxIdx) maxIdx = i;
    }
  });

  for (let i = minIdx; i <= maxIdx; i++) {
    window._checkedSet.add(filteredItems[i].location_id);
  }

  const startP = (currentPage - 1) * limit;
  const pageItems = filteredItems.slice(startP, startP + limit);
  pageItems.forEach((d, pi) => {
    const gi = startP + pi;
    const cb = document.querySelector(`.row-checkbox[data-global-idx="${gi}"]`);
    if (cb && gi >= minIdx && gi <= maxIdx) {
      cb.checked = window._checkedSet.has(d.location_id);
    }
  });

  updateBatchBar();
}

function getSelectedLocationIds() {
  ensureCheckedSet();
  return Array.from(window._checkedSet);
}

function openCorrection(idx) {
  window._batchMode = false;
  const d = filteredItems[idx];
  if (!d) return;

  document.getElementById('modal-title').textContent = 'Corrigir limbo';
  document.getElementById('modal-batch-info').style.display = 'none';
  document.getElementById('modal-single-info').style.display = 'block';
  document.getElementById('modal-loc-id').textContent = 'Location #' + d.location_id;
  document.getElementById('modal-raw').textContent = d.raw_description;
  document.getElementById('modal-current').textContent = (d.extracted_street || '-') + ' [' + (d.street_code || '') + ']';
  document.getElementById('modal-corrected-street').value = '';
  document.getElementById('modal-corrected-code').value = '';
  document.getElementById('modal-notes').value = '';
  document.getElementById('modal-search').value = '';
  document.getElementById('modal-search-results').innerHTML = '';
  document.getElementById('modal-search-results').classList.remove('active');
  document.getElementById('modal').classList.add('active');
  document.getElementById('modal-search').focus();
  window._pendingIdx = idx;
}

function openBatchCorrection() {
  const ids = getSelectedLocationIds();
  if (ids.length === 0) return;
  window._batchMode = true;

  const selected = filteredItems.filter(d => ids.includes(d.location_id));

  document.getElementById('modal-title').textContent = 'Corrigir em lote';
  document.getElementById('modal-batch-info').style.display = 'block';
  document.getElementById('modal-batch-count').textContent = ids.length;
  document.getElementById('modal-batch-list').innerHTML = selected.slice(0, 30).map(d =>
    `<div class="item" style="padding:2px 0;border-bottom:1px solid #16213e;font-size:12px;">#${d.location_id} - ${esc(d.raw_description || '').substring(0, 60)}</div>`
  ).join('') + (selected.length > 30 ? `<div class="item" style="color:#888;">... e mais ${selected.length - 30} itens</div>` : '');

  document.getElementById('modal-single-info').style.display = 'none';
  document.getElementById('modal-loc-id').textContent = '';
  document.getElementById('modal-corrected-street').value = '';
  document.getElementById('modal-corrected-code').value = '';
  document.getElementById('modal-notes').value = '';
  document.getElementById('modal-search').value = '';
  document.getElementById('modal-search-results').innerHTML = '';
  document.getElementById('modal-search-results').classList.remove('active');
  document.getElementById('modal').classList.add('active');
  document.getElementById('modal-search').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.getElementById('modal-batch-info').style.display = 'none';
  window._batchMode = false;
}

async function confirmCorrection() {
  const correctedStreet = document.getElementById('modal-corrected-street').value;
  const correctedCode = document.getElementById('modal-corrected-code').value;
  const notes = document.getElementById('modal-notes').value;

  if (window._batchMode) {
    const ids = getSelectedLocationIds();
    closeModal();
    if (ids.length === 0) return;

    for (const lid of ids) {
      await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          location_id: lid,
          verified: 'false',
          corrected_street: correctedStreet,
          corrected_street_code: correctedCode,
          notes: notes,
        }),
      });
    }
    window._checkedSet = new Set();
    await loadData();
    return;
  }

  closeModal();
  const idx = window._pendingIdx;
  if (idx === undefined) return;
  const d = filteredItems[idx];
  if (!d) return;

  await fetch('/api/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      location_id: d.location_id,
      verified: 'false',
      corrected_street: correctedStreet,
      corrected_street_code: correctedCode,
      notes: notes,
    }),
  });

  window._checkedSet.delete(d.location_id);
  await loadData();
}

async function markSingleOK(idx) {
  const d = filteredItems[idx];
  if (!d) return;
  if (!confirm(`Marcar location #${d.location_id} como OK?`)) return;

  await fetch('/api/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ location_id: d.location_id, verified: 'true' }),
  });

  window._checkedSet.delete(d.location_id);
  await loadData();
}

async function batchMarkOK() {
  const ids = getSelectedLocationIds();
  if (ids.length === 0) return;
  if (!confirm(`Marcar ${ids.length} locais como OK?`)) return;

  for (const lid of ids) {
    await fetch('/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location_id: lid, verified: 'true' }),
    });
  }

  window._checkedSet = new Set();
  await loadData();
}

async function searchStreets(q) {
  const resultsEl = document.getElementById('modal-search-results');
  if (!q || q.length < 2) { resultsEl.classList.remove('active'); resultsEl.innerHTML = ''; return; }
  const r = await fetch('/api/streets/search?q=' + encodeURIComponent(q));
  const streets = await r.json();
  resultsEl.innerHTML = streets.map(s =>
    `<div class="search-item" onclick="selectStreet('${escAttr(s.official_name)}', '${s.code}')">${esc(s.official_name)}<span class="code">${s.code}</span></div>`
  ).join('');
  resultsEl.classList.add('active');
}

function selectStreet(name, code) {
  document.getElementById('modal-corrected-street').value = name;
  document.getElementById('modal-corrected-code').value = code;
  document.getElementById('modal-search-results').classList.remove('active');
  document.getElementById('modal-search-results').innerHTML = '';
  document.getElementById('modal-search').value = name;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.getElementById('modal-search').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchStreets(this.value), 250);
});

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadData();
</script>
</body>
</html>
