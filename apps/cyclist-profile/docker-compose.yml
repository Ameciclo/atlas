services:
  app:
    image: atlas-cyclist-profile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/atlas
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  seed:
    image: atlas-cyclist-profile
    command: node apps/cyclist-profile/dist/db/seed.js
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/atlas
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
