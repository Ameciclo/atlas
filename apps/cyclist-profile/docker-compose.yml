services:
  app:
    image: atlas-cyclist-profile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=${PORT:-3000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=atlas_dev
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/atlas_dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: atlas-cyclist-profile
    command: node apps/cyclist-profile/dist/db/migrate.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=atlas_dev
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/atlas_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  seed:
    image: atlas-cyclist-profile
    command: node apps/cyclist-profile/dist/db/seed.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=atlas_dev
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/atlas_dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    profiles:
      - with-seed

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
