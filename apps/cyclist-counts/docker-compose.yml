services:
  app:
    image: atlas-cyclist-counts
    build:
      context: ../..
      dockerfile: ./apps/cyclist-counts/Dockerfile
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=${PORT:-3002}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=atlas
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/atlas
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  migrate:
    image: atlas-cyclist-counts
    build:
      context: ../..
      dockerfile: ./apps/cyclist-counts/Dockerfile
    command: node apps/cyclist-counts/dist/db/migrate.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=atlas
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/atlas
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  seed:
    image: atlas-cyclist-counts
    build:
      context: ../..
      dockerfile: ./apps/cyclist-counts/Dockerfile
    command: node apps/cyclist-counts/dist/db/seed.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=atlas
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/atlas
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    profiles:
      - with-seed

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
